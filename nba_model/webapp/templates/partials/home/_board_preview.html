<style>
.board{padding:0;overflow:hidden}
.board-head{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;border-bottom:1px solid var(--line)}
.board-head .t{font-size:12.5px;font-weight:600;color:var(--tx)}
.board-row{display:flex;align-items:center;justify-content:space-between;padding:11px 15px}
.board-row+.board-row{border-top:1px solid var(--line)}
.board-row .nm{font-size:13px;color:var(--tx)}
.board-row .nm small{color:var(--mt);font-size:10.5px}
.board-row .val{font-size:13px;font-weight:600}
.val-edge{color:var(--edge)}.val-blue{color:var(--blue)}
.board-foot{font-size:11px;color:var(--dim);text-align:center;padding:10px}
</style>
<div class="card board reveal" aria-label="Today's live MLB board preview">
  <div class="board-head">
    <span class="t"><i class="ti {{ home_config.board_icon }}" style="color:var(--edge)" aria-hidden="true"></i> {{ home_config.board_title }}</span>
    <span class="mt" style="font-size:10.5px"><span class="dot" style="width:6px;height:6px"></span> live</span>
  </div>
  {% for c in preview_cards %}
  <div class="board-row{% if c.locked %} blur-real{% endif %}">
    <span class="nm">{% if c.locked %}●●●●● ●●●{% else %}{{ c.player }} <small>· {{ c.team }}</small>{% endif %}</span>
    <span class="val {{ 'val-blue' if c.accent=='blue' else 'val-edge' }}">{{ c.value }}{% if not c.locked and c.suffix %} {{ c.suffix }}{% endif %}</span>
  </div>
  {% endfor %}
  <div class="board-foot">{{ home_config.board_footer }}</div>
</div>
