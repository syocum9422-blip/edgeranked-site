<style>
.live-strip{background:#0d1420;border-bottom:1px solid var(--line)}
.live-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 0;font-size:12.5px;color:var(--mt)}
.live-tag{display:inline-flex;align-items:center;gap:7px;color:var(--tx);font-weight:600;letter-spacing:.06em}
.live-sep{color:var(--dim)}
.live-strong{color:var(--tx);font-weight:600}
</style>
<div class="live-strip">
  <div class="wrap live-in">
    <span class="live-tag"><span class="dot"></span>LIVE</span>
    <span class="live-sep">·</span>
    <span>{{ live.date_label }}</span>
    {% if live.props_count %}
    <span class="live-sep">·</span>
    <span><span class="live-strong">{{ live.props_count }}</span> props modeled today</span>
    {% endif %}
    <span class="live-sep">·</span>
    <span>{{ live.subject }} updated {{ live.updated_label }}</span>
  </div>
</div>
